<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Änderungen im Datenbestand — Setreo</title>
<style>
  :root{
    --grund:#f7f8f7; --flaeche:#fff; --linie:#e3e6e3; --text:#161c16;
    --gedaempft:#5d675d; --akzent:#6aa511; --akzent-hell:#eef6e2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--grund);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .huelle{max-width:1080px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;
    padding-block:8px 20px;border-bottom:1px solid var(--linie);margin-bottom:24px}
  h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
  .unter{color:var(--gedaempft);font-size:13px;margin:4px 0 0}
  .marke{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--akzent);font-weight:700}
  .zeitraum{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px}
  .zeitraum button{border:1px solid var(--linie);background:var(--flaeche);color:var(--gedaempft);
    border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
  .zeitraum button[aria-pressed="true"]{background:var(--akzent-hell);border-color:var(--akzent);
    color:#33500a;font-weight:600}
  .kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:28px}
  .kachel{background:var(--flaeche);border:1px solid var(--linie);border-radius:12px;padding:16px 18px}
  .kachel .zahl{font-size:30px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kachel .etikett{color:var(--gedaempft);font-size:13px;margin-top:2px}
  section{background:var(--flaeche);border:1px solid var(--linie);border-radius:12px;
    padding:18px 20px;margin-bottom:16px}
  section h2{font-size:15px;margin:0 0 4px;font-weight:640}
  section p.hinweis{color:var(--gedaempft);font-size:13px;margin:0 0 14px}
  .balken{display:grid;gap:9px}
  .zeile{display:grid;grid-template-columns:minmax(110px,1fr) 3fr auto;gap:12px;align-items:center;font-size:14px}
  .spur{background:#eef0ee;border-radius:5px;height:9px;overflow:hidden}
  .fuell{background:var(--akzent);height:100%;border-radius:5px}
  .wert{font-variant-numeric:tabular-nums;color:var(--gedaempft);min-width:62px;text-align:right}
  footer{color:var(--gedaempft);font-size:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--linie)}
  .laden,.fehler{padding:36px 0;text-align:center;color:var(--gedaempft)}
  .fehler{color:#a3341f}
  @media (max-width:520px){
    .zeile{grid-template-columns:1fr auto;gap:4px 10px}
    .spur{grid-column:1 / -1}
  }
</style>
</head>
<body>
<div class="huelle">
  <header>
    <div>
      <div class="marke">Setreo</div>
      <h1>Änderungen im Datenbestand</h1>
      <p class="unter" id="unter">Wird geladen …</p>
    </div>
  </header>

  <div class="zeitraum" id="zeitraum" hidden>
    <button type="button" data-tage="7">7 Tage</button>
    <button type="button" data-tage="30">30 Tage</button>
    <button type="button" data-tage="90">90 Tage</button>
  </div>

  <div class="laden" id="laden">Zahlen werden geladen …</div>
  <div class="fehler" id="fehler" hidden></div>

  <div id="inhalt" hidden>
    <div class="kacheln" id="kacheln"></div>

    <section>
      <h2>Nach Straßenklasse</h2>
      <p class="hinweis">Neu hinzugekommene Vorgänge im gewählten Zeitraum.</p>
      <div class="balken" id="strassen"></div>
    </section>

    <section>
      <h2>Nach Kategorie</h2>
      <p class="hinweis">Neu hinzugekommene Vorgänge im gewählten Zeitraum.</p>
      <div class="balken" id="kategorien"></div>
    </section>

    <footer id="fuss"></footer>
  </div>
</div>

<script>
(function () {
  // Der Token steht im Pfad (/_share/v/<token>) und bleibt dort. Er wird nie geloggt,
  // nicht in den Titel geschrieben und nicht an Dritte weitergereicht -- die Seite laedt
  // ausschliesslich von der eigenen Herkunft.
  var basis = location.pathname.replace(/\/+$/, "");
  var zahl = new Intl.NumberFormat("de-DE");
  var el = function (id) { return document.getElementById(id); };

  var NAMEN = {
    autobahn: "Autobahn", bundesstrasse: "Bundesstraße", landesstrasse: "Landesstraße",
    kreisstrasse: "Kreisstraße", gemeindestrasse: "Gemeindestraße"
  };
  // Gleiche Beschriftungen wie in der angemeldeten Ansicht (src/components/project/findingMeta.ts),
  // sonst liest derselbe Wert außen anders als innen. Unbekanntes bleibt stehen wie es kommt,
  // statt als "Hindernis" zu verschwinden -- eine neue Kategorie soll auffallen.
  var KATEGORIEN = {
    bruecke: "Brücke", tunnel: "Tunnel", engstelle: "Engstelle", gewicht: "Gewicht",
    kreisverkehr: "Kreisverkehr", baustelle: "Baustelle", sperrung: "Sperrung",
    bahnuebergang: "Bahnübergang", steigung: "Steigung", ampel: "Signalanlage",
    sonstige: "Sonstiges Bauwerk"
  };
  // hasOwnProperty statt blossem Zugriff: bei "__proto__" oder "constructor" liefert der
  // direkte Zugriff das Prototyp-Objekt, und das ist truthy (dieselbe Falle wie T-734).
  // Unbekannte Schluessel bleiben stehen wie sie kommen -- eine neue Kategorie soll auffallen.
  function beschriftung(tabelle, schluessel) {
    return Object.prototype.hasOwnProperty.call(tabelle, schluessel) ? tabelle[schluessel] : schluessel;
  }

  var KOPF = [
    ["neu", "Neu hinzugekommen"], ["geaendert", "Geändert"],
    ["ausgelaufen", "Ausgelaufen"], ["entfernt", "Entfernt"]
  ];

  function balken(ziel, eintraege) {
    var max = eintraege.reduce(function (m, e) { return Math.max(m, e[1]); }, 0) || 1;
    ziel.innerHTML = "";
    if (!eintraege.length) {
      ziel.innerHTML = '<p class="hinweis" style="margin:0">Keine Einträge im Zeitraum.</p>';
      return;
    }
    eintraege.forEach(function (e) {
      var z = document.createElement("div"); z.className = "zeile";
      var n = document.createElement("div"); n.textContent = e[0];
      var s = document.createElement("div"); s.className = "spur";
      var f = document.createElement("div"); f.className = "fuell";
      f.style.width = Math.max(2, Math.round(e[1] / max * 100)) + "%";
      s.appendChild(f);
      var w = document.createElement("div"); w.className = "wert"; w.textContent = zahl.format(e[1]);
      z.appendChild(n); z.appendChild(s); z.appendChild(w);
      ziel.appendChild(z);
    });
  }

  function zeichne(d) {
    var k = el("kacheln"); k.innerHTML = "";
    KOPF.forEach(function (p) {
      var c = document.createElement("div"); c.className = "kachel";
      c.innerHTML = '<div class="zahl">' + zahl.format((d.gesamt || {})[p[0]] || 0) + "</div>"
        + '<div class="etikett">' + p[1] + "</div>";
      k.appendChild(c);
    });

    var pro = d.proStrassenklasse && d.proStrassenklasse.neu ? d.proStrassenklasse.neu : {};
    balken(el("strassen"), Object.keys(pro)
      .map(function (s) { return [beschriftung(NAMEN, s), Number(pro[s]) || 0]; })
      .filter(function (e) { return e[1] > 0; })
      .sort(function (a, b) { return b[1] - a[1]; }));

    var kat = d.proKategorie && d.proKategorie.neu ? d.proKategorie.neu : {};
    balken(el("kategorien"), Object.keys(kat)
      .map(function (s) { return [beschriftung(KATEGORIEN, s), Number(kat[s]) || 0]; })
      .filter(function (e) { return e[1] > 0; })
      .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 12));

    var basisText = d.quellenBasis
      ? zahl.format(d.quellenBasis.quellen) + " Quellen, " + zahl.format(d.quellenBasis.hindernisse) + " Einträge im Bestand"
      : "";
    el("unter").textContent = "Letzte " + d.tage + " Tage. " + basisText;

    var stand = d.berechnetAm ? new Date(d.berechnetAm) : null;
    el("fuss").textContent = "Stand der Auswertung: "
      + (stand && !isNaN(stand) ? stand.toLocaleString("de-DE") : "unbekannt")
      + ". Die Zahlen zählen Vorgänge, nicht Datensätze; kurzlaufende Maßnahmen bis 30 Tage "
      + "bleiben außen vor. Geteilte Ansicht, schreibgeschützt.";
  }

  function laden(tage) {
    el("laden").hidden = false; el("fehler").hidden = true;
    fetch(basis + "/daten?tage=" + tage, { credentials: "omit" })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status === 404
          ? "Dieser Link ist nicht mehr gültig."
          : "Die Zahlen konnten nicht geladen werden (" + r.status + ").");
        return r.json();
      })
      .then(function (d) {
        zeichne(d);
        el("inhalt").hidden = false; el("zeitraum").hidden = false; el("laden").hidden = true;
      })
      .catch(function (e) {
        el("laden").hidden = true;
        el("fehler").hidden = false;
        el("fehler").textContent = e.message || "Unerwarteter Fehler.";
      });
  }

  var knoepfe = el("zeitraum").querySelectorAll("button");
  function waehle(tage) {
    Array.prototype.forEach.call(knoepfe, function (b) {
      b.setAttribute("aria-pressed", String(Number(b.dataset.tage) === tage));
    });
    laden(tage);
  }
  Array.prototype.forEach.call(knoepfe, function (b) {
    b.addEventListener("click", function () { waehle(Number(b.dataset.tage)); });
  });
  waehle(30);
})();
</script>
</body>
</html>
